m.append(h("div",{class:"row",style:"margin-top:8px"},qi,inp,h("button",{class:"b",onclick:add},"Add")));a.append(m);return a}

function render(caret){const app=document.getElementById("app"),y=scrollY;

const ld=!offline&&!(got.recipes&&got.plan&&got.shop);
app.replaceChildren(...[msg?h("div",{class:"msg"},msg):null,ld?h("div",{class:"mut"},"Loading your planner…"):{dash,plan,rec:recipes,shop}[tab]()].filter(Boolean));
const s=app.querySelector("input[type=text][placeholder='Search recipes']");if(s&&caret!=null){s.focus();s.setSelectionRange(caret,caret)}scrollTo(0,y)}
render();
</script></body></html>
